<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Ramz-X | الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ---------- المتغيرات والأساسيات (من الكود الأصلي) ---------- */
        :root {
            --bg-primary: #000000;
            --bg-card: #111111;
            --bg-input: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #777777;
            --accent: #ff0050;
            --accent-blue: #3b82f6;
            --accent-orange: #ff7b00;
            --border: #2c2c2c;
            --radius: 1rem;
        }
        body.light {
            --bg-primary: #f5f5f5;
            --bg-card: #ffffff;
            --bg-input: #e8e8e8;
            --text-primary: #111111;
            --text-secondary: #444444;
            --text-muted: #666666;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            padding-bottom: 70px;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* ---------- الهيدر ---------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-primary);
            border-bottom: 0.5px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            cursor: pointer;
        }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
        }
        /* ---------- قصص ---------- */
        .stories-row {
            display: flex;
            gap: 12px;
            padding: 12px 8px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .stories-row::-webkit-scrollbar { display: none; }
        .story-item {
            flex: 0 0 auto;
            width: 68px;
            text-align: center;
            cursor: pointer;
            scroll-snap-align: start;
        }
        .story-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent), var(--accent-blue), var(--accent-orange));
            margin: 0 auto 4px;
        }
        .story-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-primary);
        }
        .story-username {
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 68px;
        }
        .story-add .story-ring {
            background: var(--bg-input);
            border: 2px dashed var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent);
        }
        /* ---------- التغذية ---------- */
        .feed-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 8px;
        }
        .post-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.2s;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            position: relative;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            cursor: pointer;
        }
        .author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-input);
            border: 2px solid transparent;
        }
        .author-info { flex: 1; min-width: 0; }
        .author-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .author-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .verified-badge { color: var(--accent-blue); font-size: 11px; }
        .post-date { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .post-menu-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 50%;
        }
        /* ---------- صور متعددة (من الكود الجديد) ---------- */
        .images-container {
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
            background: var(--bg-card);
            position: relative;
        }
        .images-container:active { cursor: grabbing; }
        .images-container::-webkit-scrollbar { display: none; }
        .images-wrapper {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
        }
        .image-slide {
            scroll-snap-align: start;
            flex: 0 0 100%;
            width: 100%;
        }
        .post-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            display: block;
            user-select: none;
            transition: filter 0.1s;
            background: var(--bg-input);
        }
        .post-image.flash { filter: brightness(1.25); }
        .image-counter {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            color: white;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            z-index: 5;
            pointer-events: none;
        }
        .post-content { padding: 12px; }
        .post-title {
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .category-badge {
            font-size: 10px;
            background: var(--bg-input);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-right: 6px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .post-text {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 6px;
            max-height: 80px;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .post-text.expanded { max-height: none; }
        .more-btn {
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }
        .hashtag {
            color: var(--accent);
            font-size: 12px;
            margin-top: 4px;
            cursor: pointer;
            background: rgba(255, 0, 80, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        /* ---------- شريط الأزرار (من الكود الجديد مع الاحتفاظ بالوظائف) ---------- */
        .actions-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px;
            border-top: 0.5px solid var(--border);
            background: var(--bg-card);
            gap: 8px;
            flex-wrap: nowrap;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: rgba(30,30,35,0.9);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            flex: 1;
            white-space: nowrap;
            min-width: 70px;
            font-family: 'Cairo', sans-serif;
            position: relative;
        }
        .action-btn:active { transform: scale(0.95); background: #2a2a2a; }
        .action-btn i, .action-btn .fallback-icon { font-size: 18px; width: 24px; text-align: center; }
        .action-btn .fallback-icon { display: none; }
        body.no-fontawesome .action-btn i { display: none; }
        body.no-fontawesome .action-btn .fallback-icon { display: inline-block; }
        .action-btn .number { font-size: 14px; font-weight: 700; }
        /* ألوان الحالات النشطة */
        .action-btn.liked i,
        .action-btn.liked .fallback-icon,
        .action-btn.liked .number { color: #ff2a6d; }
        .action-btn.saved i,
        .action-btn.saved .fallback-icon { color: #ffcc44; }
        .action-btn.reposted i,
        .action-btn.reposted .fallback-icon { color: #4caf50; }
        @keyframes heartBeat {
            0%,100%{transform:scale(1)}
            40%{transform:scale(1.2)}
        }
        .action-btn.liked i { animation: heartBeat 0.3s ease; }
        /* تأثير التموج للأزرار */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleEffect 0.5s ease-out;
            pointer-events: none;
        }
        .ripple.red { background: rgba(255,42,109,0.4); }
        .ripple.green { background: rgba(76,175,80,0.4); }
        .ripple.yellow { background: rgba(255,204,68,0.4); }
        @keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }
        /* ===== قلب صغير متطاير ===== */
        .flying-heart {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            z-index: 2000;
            color: #ff2a6d;
            text-shadow: none;
            will-change: transform, opacity;
        }
        /* ---------- نافذة التعليقات ---------- */
        .comments-bottom-sheet, .share-bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-card);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2100;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }
        .comments-bottom-sheet.open, .share-bottom-sheet.open { bottom: 0; }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 2px;
            margin: 8px auto;
            cursor: grab;
        }
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px 15px;
            border-bottom: 1px solid var(--border);
        }
        .sheet-header h3 { font-size: 17px; font-weight: 700; }
        .close-sheet-btn {
            background: var(--bg-input);
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .comments-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
        }
        .comment-item { margin-bottom: 16px; }
        .comment-main { display: flex; gap: 10px; }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .comment-content {
            flex: 1;
            background: var(--bg-input);
            padding: 10px 14px;
            border-radius: 18px;
            border-top-right-radius: 4px;
        }
        .comment-author { font-weight: 700; font-size: 13px; }
        .comment-text { font-size: 13px; margin-top: 3px; }
        .comment-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
        .comment-actions { display: flex; gap: 16px; margin-top: 6px; padding-right: 46px; }
        .comment-action { cursor: pointer; font-size: 11px; color: var(--text-muted); display: flex; gap: 4px; align-items: center; }
        .comment-action.liked { color: var(--accent); }
        .comment-input-area {
            background: var(--bg-card);
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
            align-items: center;
        }
        .comment-input-area input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
        }
        .comment-input-area input:focus { border-color: var(--accent); }
        .input-icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
        }
        .send-btn {
            background: var(--accent);
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
        }
        .send-btn:active { transform: scale(0.95); background: #e00045; }
        .emoji-picker {
            position: absolute;
            bottom: 65px;
            right: 10px;
            background: var(--bg-card);
            border-radius: 15px;
            padding: 10px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 2200;
            flex-wrap: wrap;
            gap: 4px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        .emoji-picker.active { display: flex; }
        .emoji-option { font-size: 24px; cursor: pointer; padding: 6px; border-radius: 8px; }
        /* ---------- المشاركة المتقدمة ---------- */
        .share-bottom-sheet { z-index: 2300; height: 55%; }
        .share-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 10px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .share-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeInUp 0.3s ease; }
        .social-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-top: 10px;
        }
        .social-icon {
            width: 65px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .social-icon:active { transform: scale(0.9); }
        .social-icon .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 6px;
            font-size: 24px;
            color: white;
        }
        .social-icon span { font-size: 10px; color: var(--text-secondary); font-weight: 600; }
        .social-icon.copy-link .icon-circle { background: var(--accent); }
        .social-icon.whatsapp .icon-circle { background: #25D366; }
        .social-icon.facebook .icon-circle { background: #1877F2; }
        .social-icon.twitter .icon-circle { background: #1DA1F2; }
        .social-icon.telegram .icon-circle { background: #0088CC; }
        .social-icon.instagram .icon-circle { background: #E4405F; }
        .social-icon.email .icon-circle { background: #666; }
        /* ---------- الإشعارات (toast) ---------- */
        .toast, #globalToast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000dd;
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 3000;
            white-space: nowrap;
            animation: toastFade 0.25s ease;
        }
        @keyframes toastFade {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        /* ---------- الشريط السفلي ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 8px;
            border-top: 1px solid var(--border);
            z-index: 100;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
        }
        .nav-item {
            background: none;
            border: none;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            border-radius: 12px;
            transition: 0.2s;
            font-family: 'Cairo', sans-serif;
        }
        .nav-item.active { color: var(--accent); }
        .nav-item .nav-icon { font-size: 22px; }
        .nav-item .nav-label { font-size: 10px; font-weight: 600; }
        .nav-item.create-btn .nav-icon { font-size: 28px; color: var(--accent); }
        .infinite-loader {
            text-align: center;
            padding: 24px;
            color: var(--accent);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        @media (max-width: 480px) {
            .action-btn { padding: 6px 8px; font-size: 12px; min-width: 60px; }
            .action-btn i, .action-btn .fallback-icon { font-size: 16px; width: 22px; }
            .action-btn .number { font-size: 12px; }
            .flying-heart { font-size: 18px; }
        }
    </style>
</head>
<body class="dark">
    <div class="header">
        <div class="logo" onclick="window.location.href='home.html'">Ramz-X</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="window.location.href='search.html'"><i class="fas fa-search"></i></button>
            <button class="icon-btn" id="darkModeToggle"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i></button>
        </div>
    </div>
    <main>
        <div class="stories-row" id="storiesRow">
            <div class="story-item story-add" onclick="showToast('📸 افتح الكاميرا لإضافة ستوري')">
                <div class="story-ring"><span>+</span></div>
                <div class="story-username">أضف ستوري</div>
            </div>
        </div>
        <div class="feed-container" id="feedContainer">
            <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><p>جاري تحميل المنشورات...</p></div>
        </div>
        <div id="infiniteLoader" class="infinite-loader"><i class="fas fa-spinner fa-pulse spinner"></i> جاري تحميل المزيد...</div>
    </main>
    <div id="commentsSheet" class="comments-bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header"><h3>💬 التعليقات (<span id="sheetCommentsCount">0</span>)</h3><button class="close-sheet-btn" id="closeSheetBtn">&times;</button></div>
        <div class="comments-list-container" id="sheetCommentsList"></div>
        <div class="comment-input-area">
            <button class="input-icon-btn" id="emojiBtn"><i class="far fa-smile-wink"></i></button>
            <button class="input-icon-btn" id="attachImageBtn"><i class="fas fa-image"></i></button>
            <input type="text" id="newCommentInput" placeholder="اكتب تعليقاً...">
            <button class="send-btn" id="sendCommentBtn">إرسال</button>
        </div>
        <div id="emojiPicker" class="emoji-picker"></div>
        <input type="file" id="imageUpload" accept="image/*" style="display:none">
    </div>
    <div id="shareAdvancedSheet" class="share-bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header"><h3>📤 مشاركة متقدمة</h3><button class="close-sheet-btn" id="closeShareSheetBtn">&times;</button></div>
        <div class="share-tabs">
            <button class="tab-btn active" data-tab="tab-share">مشاركة</button>
            <button class="tab-btn" data-tab="tab-download">تحميل</button>
            <button class="tab-btn" data-tab="tab-report">تبليغ</button>
            <button class="tab-btn" data-tab="tab-embed">تضمين</button>
            <button class="tab-btn" data-tab="tab-qr">QR Code</button>
        </div>
        <div class="tab-content">
            <div class="tab-pane active" id="tab-share">
                <div class="social-icons">
                    <div class="social-icon whatsapp" data-platform="whatsapp"><div class="icon-circle"><i class="fab fa-whatsapp"></i></div><span>واتساب</span></div>
                    <div class="social-icon facebook" data-platform="facebook"><div class="icon-circle"><i class="fab fa-facebook-f"></i></div><span>فيسبوك</span></div>

    <script>
        // ==================== تكوين Supabase ====================
        const SUPABASE_URL = "https://zlkpoghjbqtnhzhmmdbw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7evDsA5aEgPMsRBTFjntrg_XZQFmNLw";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = supabaseClient;

        // ==================== دوال مساعدة عامة ====================
        function showToast(msg, isError = false) {
            let toast = document.getElementById('globalToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'globalToast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            toast.style.borderColor = isError ? '#ff6b6b' : 'rgba(255,255,255,0.2)';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }
        window.showToast = showToast;

        function formatNumber(num) {
            if (num === undefined || num === null) return '0';
            if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1_000) return (num < 10_000 ? (num/1000).toFixed(1) : Math.round(num/1000)) + 'K';
            return num.toString();
        }
        window.formatNumber = formatNumber;

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        function timeAgo(date) {
            const diff = Math.floor((new Date() - new Date(date)) / 1000);
            if (diff < 60) return 'الآن';
            if (diff < 3600) return `${Math.floor(diff/60)} دقائق`;
            if (diff < 86400) return `${Math.floor(diff/3600)} ساعات`;
            return `${Math.floor(diff/86400)} أيام`;
        }

        function parseNumberFromFormatted(str) {
            if (!str) return 0;
            str = str.toString();
            if (str.includes('M')) return parseFloat(str) * 1_000_000;
            if (str.includes('K')) return parseFloat(str) * 1000;
            return parseInt(str, 10);
        }

        // ==================== دوال RPC الأساسية ====================
        async function incrementLikes(rowId) { try { await supabaseClient.rpc('increment_likes', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function decrementLikes(rowId) { try { await supabaseClient.rpc('decrement_likes', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function incrementFavorites(rowId) { try { await supabaseClient.rpc('increment_favorites', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function decrementFavorites(rowId) { try { await supabaseClient.rpc('decrement_favorites', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function incrementReposts(rowId) { try { await supabaseClient.rpc('increment_reposts', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function decrementReposts(rowId) { try { await supabaseClient.rpc('decrement_reposts', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function incrementViews(rowId) { try { await supabaseClient.rpc('increment_views', { row_id: rowId }); } catch(e) { console.warn(e); } }
        async function incrementCommentsCount(rowId) { try { await supabaseClient.rpc('increment_comments_count', { row_id: rowId }); } catch(e) { console.warn(e); } }

        // ==================== نظام المشاهدات المتجددة ====================
        let recentViewsSet = new Set();
        let viewThrottleTimer = null;
        function recordView(postId) {
            if (!postId) return;
            if (recentViewsSet.has(postId)) return;
            recentViewsSet.add(postId);
            if (viewThrottleTimer) clearTimeout(viewThrottleTimer);
            viewThrottleTimer = setTimeout(() => { recentViewsSet.clear(); }, 10000);
            incrementViews(postId).catch(console.warn);
            const viewsSpan = document.querySelector(`.views-btn[data-id="${postId}"] .number`);
            if (viewsSpan) {
                let current = parseNumberFromFormatted(viewsSpan.innerText);
                viewsSpan.innerText = formatNumber(current + 1);
            }
        }
        function setupViewObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const postId = entry.target.dataset.id;
                        if (postId) recordView(postId);
                    }
                });
            }, { threshold: 0.5 });
            document.querySelectorAll('.post-card').forEach(card => observer.observe(card));
        }

        // ==================== إدارة المستخدمين ====================
        async function createGuestUser() {
            const guestId = crypto.randomUUID();
            const guestUser = { id: guestId, username: 'زائر_' + Math.floor(Math.random()*10000), full_name: 'زائر', avatar: 'https://randomuser.me/api/portraits/lego/1.jpg', is_guest: true, verified: false };
            await supabaseClient.from('users').upsert(guestUser);
            localStorage.setItem('currentUser', JSON.stringify(guestUser));
            return guestUser;
        }
        async function checkSession() {
            let currentUser = localStorage.getItem('currentUser') ? JSON.parse(localStorage.getItem('currentUser')) : null;
            if (!currentUser) currentUser = await createGuestUser();
            return currentUser;
        }

        // ==================== دوال التفاعلات الأساسية (متوافقة مع الأزرار الجديدة) ====================
        async function toggleLike(postId, btnElement, isDoubleTap = false, event = null) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) { showToast('يرجى تسجيل الدخول أولاً', true); return; }
            if (event && !isDoubleTap) addRipple(event, btnElement, 'red');

            const isLiked = btnElement.classList.contains('liked');
            const countSpan = btnElement.querySelector('.number');
            let current = countSpan ? parseNumberFromFormatted(countSpan.innerText) : 0;
            const icon = btnElement.querySelector('i');
            const fallback = btnElement.querySelector('.fallback-icon');

            if (!isLiked) {
                await supabaseClient.from('likes').insert({ user_id: user.id, post_id: postId });
                await incrementLikes(postId);
                btnElement.classList.add('liked');
                if (icon) icon.className = 'fas fa-heart';
                if (fallback) fallback.style.color = '#ff2a6d';
                if (countSpan) countSpan.innerText = formatNumber(current + 1);
                showToast('👍 تم الإعجاب');
                if (isDoubleTap && event) {
                    burstHearts(event.clientX, event.clientY);
                    flashCurrentImage(postId);
                }
            } else {
                await supabaseClient.from('likes').delete().eq('user_id', user.id).eq('post_id', postId);
                await decrementLikes(postId);
                btnElement.classList.remove('liked');
                if (icon) icon.className = 'far fa-heart';
                if (fallback) fallback.style.color = '';
                if (countSpan) countSpan.innerText = formatNumber(Math.max(0, current - 1));
                showToast('👎 تم إلغاء الإعجاب');
                if (isDoubleTap) flashCurrentImage(postId);
            }
        }

        async function toggleFavorite(postId, btnElement, event) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) { showToast('يرجى تسجيل الدخول أولاً', true); return; }
            if (event) addRipple(event, btnElement, 'yellow');
            const isSaved = btnElement.classList.contains('saved');
            const countSpan = btnElement.querySelector('.number');
            let current = countSpan ? parseNumberFromFormatted(countSpan.innerText) : 0;
            const icon = btnElement.querySelector('i');
            const fallback = btnElement.querySelector('.fallback-icon');
            if (!isSaved) {
                await supabaseClient.from('favorites').insert({ user_id: user.id, post_id: postId });
                await incrementFavorites(postId);
                btnElement.classList.add('saved');
                if (icon) icon.className = 'fas fa-bookmark';
                if (fallback) fallback.style.color = '#ffcc44';
                if (countSpan) countSpan.innerText = formatNumber(current + 1);
                showToast('⭐ تم الحفظ في المفضلة');
            } else {
                await supabaseClient.from('favorites').delete().eq('user_id', user.id).eq('post_id', postId);
                await decrementFavorites(postId);
                btnElement.classList.remove('saved');
                if (icon) icon.className = 'far fa-bookmark';
                if (fallback) fallback.style.color = '';
                if (countSpan) countSpan.innerText = formatNumber(Math.max(0, current - 1));
                showToast('تمت الإزالة من المفضلة');
            }
        }

        async function toggleRepost(postId, btnElement, event) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) { showToast('يرجى تسجيل الدخول أولاً', true); return; }
            if (event) addRipple(event, btnElement, 'green');
            const isReposted = btnElement.classList.contains('reposted');
            const countSpan = btnElement.querySelector('.number');
            let current = countSpan ? parseNumberFromFormatted(countSpan.innerText) : 0;
            const icon = btnElement.querySelector('i');
            const fallback = btnElement.querySelector('.fallback-icon');
            if (!isReposted) {
                const { data: original } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
                if (original) {
                    await supabaseClient.from('posts').insert({
                        title: original.title,
                        content: `🔄 أعاد ${user.username} نشر منشور ${original.author_name}\n\n${original.content}`,
                        image: original.image,
                        author_id: user.id,
                        author_name: user.username,
                        hashtag: original.hashtag,
                        category: original.category,
                        created_at: new Date().toISOString()
                    });
                    await incrementReposts(postId);
                }
                btnElement.classList.add('reposted');
                if (icon) icon.className = 'fas fa-share-square';
                if (fallback) fallback.style.color = '#4caf50';
                if (countSpan) countSpan.innerText = formatNumber(current + 1);
                showToast('🔁 تمت إعادة النشر');
            } else {
                const { data: repostedPost } = await supabaseClient.from('posts').select('id').eq('author_id', user.id).contains('content', `🔄 أعاد ${user.username} نشر منشور`).order('created_at', { ascending: false }).limit(1).single();
                if (repostedPost) await supabaseClient.from('posts').delete().eq('id', repostedPost.id);
                await decrementReposts(postId);
                btnElement.classList.remove('reposted');
                if (icon) icon.className = 'far fa-share-square';
                if (fallback) fallback.style.color = '';
                if (countSpan) countSpan.innerText = formatNumber(Math.max(0, current - 1));
                showToast('↩️ تم إلغاء إعادة النشر');
            }
        }

        // ==================== تأثيرات الصور المتعددة وتطاير القلوب ====================
        function burstHearts(x, y) {
            const heartCount = 10;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'flying-heart';
                heart.innerHTML = '❤️';
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 30;
                heart.style.left = (x + offsetX) + 'px';
                heart.style.top = (y + offsetY) + 'px';
                heart.style.fontSize = (15 + Math.random() * 15) + 'px';
                const angle = (Math.random() * Math.PI / 1.5) - Math.PI / 3;
                const velocity = 80 + Math.random() * 60;
                const vx = Math.sin(angle) * velocity;
                const vy = -Math.abs(Math.cos(angle)) * velocity - 30;
                const rotation = (Math.random() - 0.5) * 60;
                document.body.appendChild(heart);
                heart.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${vx}px, ${vy}px) rotate(${rotation}deg)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 300,
                    easing: 'cubic-bezier(0.2, 0.9, 0.4, 1.1)',
                    fill: 'forwards'
                });
                setTimeout(() => heart.remove(), 1000);
            }
        }

        function flashCurrentImage(postId) {
            const postCard = document.getElementById(`post-${postId}`);
            if (!postCard) return;
            const container = postCard.querySelector('.images-container');
            if (!container) return;
            const scrollLeft = container.scrollLeft;
            const slideW = container.clientWidth;
            const idx = Math.round(scrollLeft / slideW);
            const currentImg = postCard.querySelectorAll('.post-image')[idx];
            if (currentImg) {
                currentImg.classList.add('flash');
                setTimeout(() => currentImg.classList.remove('flash'), 120);
            }
        }

        function addRipple(e, el, colorClass) {
            if (!e) return;
            const ripple = document.createElement('span');
            ripple.className = `ripple ${colorClass}`;
            const rect = el.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
            el.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
        }

        // ==================== جلب التغذية والتحميل المتقطع ====================
        let feedPosts = [], feedLastCursor = null, feedHasMore = true, feedIsLoading = false;
        async function fetchFeedPage(limit = 10) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) return [];
            if (feedIsLoading) return [];
            feedIsLoading = true;
            try {
                let query = supabaseClient
                    .from('posts')
                    .select(`*, users:author_id (id, username, avatar, verified)`)
                    .eq('hidden', false)
                    .order('created_at', { ascending: false })
                    .limit(limit);
                if (feedLastCursor) query = query.lt('created_at', feedLastCursor);
                const { data, error } = await query;
                if (error) throw error;
                if (!data || data.length === 0) { feedHasMore = false; return []; }
                feedLastCursor = data[data.length-1].created_at;
                return data.map(p => ({
                    id: p.id, title: p.title, content: p.content, image: p.image ? [p.image] : [],
                    author_id: p.author_id, author_name: p.users?.username || p.author_name,
                    author_avatar: p.users?.avatar,
                    created_at: p.created_at, likes_count: p.likes_count || 0,
                    comments_count: p.comments_count || 0, views_count: p.views_count || 0,
                    reposts_count: p.reposts_count || 0, favorites_count: p.favorites_count || 0,
                    hashtag: p.hashtag, category: p.category || 'عام',
                    verified: p.users?.verified || false
                }));
            } catch(err) { console.error(err); return []; }
            finally { feedIsLoading = false; }
        }

        async function renderFeed(posts, append = false) {
            const container = document.getElementById('feedContainer');
            if (!posts.length && !append) {
                container.innerHTML = '<div class="empty-state"><i class="far fa-newspaper"></i><p>لا توجد منشورات بعد</p><p style="font-size:12px;">كن أول من ينشر!</p></div>';
                return;
            }
            let html = '';
            for(let p of posts) {
                const imagesArray = Array.isArray(p.image) && p.image.length ? p.image : (p.image ? [p.image] : []);
                const slides = imagesArray.map((img, idx) => `<div class="image-slide"><img class="post-image" src="${img}" alt="صورة ${idx+1}" loading="lazy"></div>`).join('');
                html += `
                <div class="post-card" data-id="${p.id}" id="post-${p.id}">
                    <div class="post-header" onclick="window.location.href='public-profile.html?user=${p.author_id}'">
                        <img class="author-avatar" src="${p.author_avatar}" alt="">
                        <div class="author-info"><div class="author-name-row"><span class="author-name">${escapeHtml(p.author_name)}</span>${p.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}</div><div class="post-date">${timeAgo(p.created_at)}</div></div>
                        <button class="post-menu-btn" onclick="event.stopPropagation(); showPostMenu('${p.id}')"><i class="fas fa-ellipsis-h"></i></button>
                    </div>
                    ${imagesArray.length ? `
                    <div class="images-container" data-post-id="${p.id}">
                        <div class="images-wrapper">${slides}</div>
                        ${imagesArray.length > 1 ? `<div class="image-counter">1/${imagesArray.length}</div>` : ''}
                    </div>` : ''}
                    <div class="post-content">
                        <div class="post-title">${escapeHtml(p.title)} <span class="category-badge" onclick="event.stopPropagation(); window.location.href='search.html?q=${encodeURIComponent(p.category)}'">${escapeHtml(p.category)}</span></div>
                        <div class="post-text" id="post-text-${p.id}">${escapeHtml(p.content || '').substring(0,150)}${p.content?.length>150?'...':''}</div>
                        ${p.content?.length>150 ? `<span class="more-btn" onclick="toggleFullText('${p.id}')" id="more-btn-${p.id}">...عرض المزيد</span>` : ''}
                        ${p.hashtag ? `<div class="hashtag" onclick="window.location.href='search.html?q=${encodeURIComponent(p.hashtag)}'">#${escapeHtml(p.hashtag)}</div>` : ''}
                    </div>
                    <div class="actions-bar">
                        <button class="action-btn like-btn" data-id="${p.id}" onclick="handleLikeClick(this, event, '${p.id}')">
                            <span class="number">${formatNumber(p.likes_count)}</span>
                            <i class="far fa-heart"></i>
                            <span class="fallback-icon">❤️</span>
                        </button>
                        <button class="action-btn comment-btn" data-id="${p.id}" onclick="openComments('${p.id}')">
                            <span class="number">${formatNumber(p.comments_count)}</span>
                            <i class="far fa-comment"></i>
                            <span class="fallback-icon">💬</span>
                        </button>
                        <button class="action-btn share-btn" data-id="${p.id}" onclick="handleRepostClick(this, event, '${p.id}')" oncontextmenu="event.preventDefault(); openShareAdvanced('${p.id}')" onmousedown="startLongPress(event,'${p.id}')" onmouseup="cancelLongPress()" ontouchstart="startLongPress(event,'${p.id}')" ontouchend="cancelLongPress()">
                            <span class="number">${formatNumber(p.reposts_count)}</span>
                            <i class="far fa-share-square"></i>
                            <span class="fallback-icon">🔄</span>
                        </button>
                        <button class="action-btn save-btn" data-id="${p.id}" onclick="handleSaveClick(this, event, '${p.id}')">
                            <span class="number">${formatNumber(p.favorites_count)}</span>
                            <i class="far fa-bookmark"></i>
                            <span class="fallback-icon">⭐</span>
                        </button>
                        <button class="action-btn views-btn" data-id="${p.id}" disabled style="opacity:0.7; cursor:default;">
                            <span class="number">${formatNumber(p.views_count)}</span>
                            <i class="far fa-eye"></i>
                            <span class="fallback-icon">👁️</span>
                        </button>
                    </div>
                </div>`;
            }
            if(append) container.insertAdjacentHTML('beforeend', html);
            else container.innerHTML = html;
            attachImageScrollers();
            setupViewObserver();
        }

        function attachImageScrollers() {
            document.querySelectorAll('.images-container').forEach(container => {
                const counter = container.querySelector('.image-counter');
                const slides = container.querySelectorAll('.image-slide');
                if (slides.length <= 1) return;
                const updateCounter = () => {
                    if (!counter) return;
                    const scrollLeft = container.scrollLeft;
                    const slideW = container.clientWidth;
                    const current = Math.round(scrollLeft / slideW);
                    counter.innerText = `${current+1}/${slides.length}`;
                };
                container.addEventListener('scroll', updateCounter);
                window.addEventListener('resize', updateCounter);
                updateCounter();
                // إضافة النقر المزدوج على الصورة
                container.querySelectorAll('.post-image').forEach(img => {
                    img.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        const postCard = container.closest('.post-card');
                        const postId = postCard.dataset.id;
                        const likeBtn = postCard.querySelector('.like-btn');
                        if (likeBtn) {
                            toggleLike(postId, likeBtn, true, e);
                        }
                    });
                });
            });
        }

        async function refreshFeed() {
            feedLastCursor = null;
            feedHasMore = true;
            feedIsLoading = false;
            const posts = await fetchFeedPage(10);
            feedPosts = posts;
            renderFeed(posts, false);
            const loader = document.getElementById('infiniteLoader');
            if (loader) loader.style.display = feedHasMore ? 'flex' : 'none';
        }

        async function loadMore() {
            if (feedIsLoading || !feedHasMore) return;
            feedIsLoading = true;
            const loader = document.getElementById('infiniteLoader');
            if (loader) loader.style.display = 'flex';
            try {
                const newPosts = await fetchFeedPage(10);
                if (newPosts.length) {
                    feedPosts.push(...newPosts);
                    renderFeed(newPosts, true);
                }
                if (!feedHasMore && loader) loader.style.display = 'none';
            } catch (err) {
                console.error(err);
                showToast("حدث خطأ أثناء تحميل المزيد", true);
                if (loader) loader.style.display = 'none';
            } finally {
                feedIsLoading = false;
            }
        }
        window.onscroll = () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadMore();
        };

        // ==================== دوال إضافية ====================
        function toggleFullText(postId) {
            const textDiv = document.getElementById(`post-text-${postId}`);
            const moreBtn = document.getElementById(`more-btn-${postId}`);
            if(textDiv.classList.contains('expanded')) {
                textDiv.classList.remove('expanded');
                const post = feedPosts.find(p=>p.id===postId);
                textDiv.textContent = (post?.content || '').substring(0,150)+(post?.content?.length>150?'...':'');
                if(moreBtn) moreBtn.textContent = '...عرض المزيد';
            } else {
                textDiv.classList.add('expanded');
                const post = feedPosts.find(p=>p.id===postId);
                textDiv.textContent = post?.content || '';
                if(moreBtn) moreBtn.textContent = 'عرض أقل';
            }
        }

        function openFullscreen(postId) {
            const post = feedPosts.find(p=>p.id===postId);
            if(!post || !post.image?.[0]) return;
            const full = document.createElement('div');
            full.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:2500;display:flex;flex-direction:column;align-items:center;justify-content:center';
            full.innerHTML = `<button style="position:fixed;top:16px;right:16px;background:rgba(0,0,0,0.6);border:none;color:white;font-size:24px;width:44px;height:44px;border-radius:50%;" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
                              <img src="${post.image[0]}" style="max-height:80vh;max-width:90%;object-fit:contain;border-radius:12px;">
                              <div style="color:white;margin-top:20px;text-align:center;">${escapeHtml(post.title)}</div>`;
            document.body.appendChild(full);
        }

        function showPostMenu(postId) { showToast('قائمة المنشور'); }
        let longPressTimer = null;
        function startLongPress(e, postId) { longPressTimer = setTimeout(()=>openShareAdvanced(postId),500); }
        function cancelLongPress() { if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; } }
        function openShareAdvanced(postId) { showToast('📤 قائمة المشاركة المتقدمة'); document.getElementById('shareAdvancedSheet').classList.add('open'); }
        function closeShareSheet() { document.getElementById('shareAdvancedSheet').classList.remove('open'); }
        function downloadPostImage() { showToast('جاري التحميل...'); }
        function reportCurrentPost() { showToast('تم الإبلاغ'); }
        let currentCommentPostId = null;
        function openComments(postId) { currentCommentPostId = postId; showToast('📝 فتح نافذة التعليقات'); document.getElementById('commentsSheet').classList.add('open'); }

        window.handleLikeClick = (btn, e, postId) => { toggleLike(postId, btn, false, e); };
        window.handleSaveClick = (btn, e, postId) => { toggleFavorite(postId, btn, e); };
        window.handleRepostClick = (btn, e, postId) => { toggleRepost(postId, btn, e); };
        window.toggleFullText = toggleFullText;
        window.openFullscreen = openFullscreen;
        window.showPostMenu = showPostMenu;
        window.startLongPress = startLongPress;
        window.cancelLongPress = cancelLongPress;
        window.openShareAdvanced = openShareAdvanced;
        window.closeShareSheet = closeShareSheet;
        window.downloadPostImage = downloadPostImage;
        window.reportCurrentPost = reportCurrentPost;
        window.openComments = openComments;

        // ==================== مراقبة الشبكة ====================
        let lastNetworkStatus = 'online';
        async function measureNetworkSpeed() {
            if (!navigator.onLine) return 0;
            const start = performance.now();
            try {
                await fetch('https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png?t='+Date.now(), { mode: 'no-cors' });
                const duration = (performance.now() - start) / 1000;
                return (5 * 8) / duration / 1000;
            } catch(e) { return 0; }
        }
        async function checkNetworkAndNotify() {
            const isOnline = navigator.onLine;
            if (!isOnline) {
                if (lastNetworkStatus !== 'offline') showToast('❌ غير متصل بالإنترنت', true);
                lastNetworkStatus = 'offline';
                return;
            }
            const speed = await measureNetworkSpeed();
            if (speed < 0.5) {
                if (lastNetworkStatus !== 'poor') showToast('⚠️ شبكة ضعيفة جداً', false);
                lastNetworkStatus = 'poor';
            } else if (speed < 1.5) {
                if (lastNetworkStatus !== 'slow') showToast('📡 شبكة بطيئة', false);
                lastNetworkStatus = 'slow';
            } else {
                if (lastNetworkStatus !== 'good') showToast('✅ تم الاتصال بالشبكة (جودة جيدة)', false);
                lastNetworkStatus = 'good';
            }
        }
        window.addEventListener('online', () => { showToast('✅ تم الاتصال بالإنترنت', false); checkNetworkAndNotify(); });
        window.addEventListener('offline', () => { showToast('❌ انقطع الاتصال بالإنترنت', true); });
        setInterval(checkNetworkAndNotify, 30000);
        checkNetworkAndNotify();

        // ==================== كشف Font Awesome ====================
        function checkFontAwesome() {
            let test = document.createElement('i');
            test.className = 'fas fa-heart';
            test.style.cssText = 'position:absolute; visibility:hidden; font-family: "Font Awesome 6 Free";';
            document.body.appendChild(test);
            let loaded = window.getComputedStyle(test).fontFamily.indexOf('Font Awesome') !== -1;
            document.body.removeChild(test);
            if (!loaded) document.body.classList.add('no-fontawesome');
        }
        setTimeout(checkFontAwesome, 500);

        // ==================== سلوك زر الرئيسية (نقرة واحدة / نقرة مزدوجة) ====================
        let homeClickTimer = null;
        const homeBtn = document.getElementById('homeNavBtn');
        if (homeBtn) {
            homeBtn.removeAttribute('onclick');
            homeBtn.addEventListener('click', (e) => {
                if (homeClickTimer) {
                    clearTimeout(homeClickTimer);
                    homeClickTimer = null;
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    refreshFeed().then(() => showToast('🔄 تم تحديث المنشورات', false));
                } else {
                    homeClickTimer = setTimeout(() => {
                        const currentPath = window.location.pathname.split('/').pop();
                        if (currentPath === 'home.html' || currentPath === '' || currentPath === 'index.html') {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        } else {
                            window.location.href = 'home.html';
                        }
                        homeClickTimer = null;
                    }, 200);
                }
            });
        }

        // ==================== تهيئة الصفحة ====================
        async function init() {
            await checkSession();
            await refreshFeed();
            document.getElementById('darkModeToggle').addEventListener('click', () => {
                document.body.classList.toggle('light');
                const icon = document.querySelector('#darkModeToggle i');
                if(document.body.classList.contains('light')) icon.className = 'fas fa-sun';
                else icon.className = 'fas fa-moon';
                localStorage.setItem('darkMode', document.body.classList.contains('light') ? 'false' : 'true');
            });
            if(localStorage.getItem('darkMode') === 'false') document.body.classList.add('light');
            document.getElementById('closeSheetBtn')?.addEventListener('click', () => document.getElementById('commentsSheet').classList.remove('open'));
            document.getElementById('closeShareSheetBtn')?.addEventListener('click', closeShareSheet);
            const storiesRow = document.getElementById('storiesRow');
            if(storiesRow && storiesRow.children.length === 1) {
                ['أحمد', 'سارة', 'محمد'].forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'story-item';
                    div.onclick = () => showToast(`👀 ستوري ${name}`);
                    div.innerHTML = `<div class="story-ring"><img class="story-avatar" src="https://randomuser.me/api/portraits/lego/${Math.floor(Math.random()*8)+1}.jpg"></div><div class="story-username">${name}</div>`;
                    storiesRow.appendChild(div);
                });
            }
            console.log('✅ home.html جاهز مع رموز التفاعلات المطورة');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
