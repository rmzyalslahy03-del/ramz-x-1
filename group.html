<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مجموعة | Ramz-X</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --surface: #fff; --surface2: #f1f5f9;
            --text: #0f172a; --text2: #475569; --text3: #94a3b8;
            --border: #cbd5e1; --accent: #3b82f6; --radius: 16px;
        }
        body.dark {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
            --text: #e2e8f0; --text2: #cbd5e1; --text3: #94a3b8; --border: #475569;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); font-family:'Cairo',sans-serif; min-height:100vh; padding-bottom:80px; color:var(--text); }
        .container { max-width:600px; margin:0 auto; padding:16px; }
        .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
        .back-btn { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text); }
        .group-cover { background:var(--accent); height:120px; border-radius:var(--radius); margin-bottom:-40px; }
        .group-info { padding:20px; background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); margin-bottom:20px; }
        .group-name { font-size:1.5rem; font-weight:800; }
        .group-desc { color:var(--text2); margin:12px 0; }
        .join-btn { background:var(--accent); color:#fff; padding:10px 24px; border-radius:30px; border:none; font-weight:600; cursor:pointer; }
        .post-form { margin-bottom:20px; }
        .post-input { width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Cairo',sans-serif; resize:vertical; }
        .post-btn { background:var(--accent); color:#fff; padding:10px 20px; border-radius:20px; border:none; cursor:pointer; margin-top:8px; }
        .posts-list { display:flex; flex-direction:column; gap:12px; }
        .post-item { background:var(--surface); padding:12px; border-radius:12px; border:1px solid var(--border); }
        .post-author { font-weight:700; margin-bottom:6px; }
        .post-content { color:var(--text2); }
        .members-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
        .member-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; }
        .bottom-footer {
            position:fixed; bottom:0; left:0; right:0; background:var(--surface);
            display:flex; justify-content:space-around; padding:8px 0;
            border-top:1px solid var(--border); z-index:30;
        }
        .footer-button { background:none; border:none; text-align:center; cursor:pointer; color:var(--text2); text-decoration:none; }
        .icon { font-size:22px; display:block; margin-bottom:4px; }
        .label { font-size:11px; }
    </style>
</head>
<body class="dark">

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
        <div id="groupNameHeader"></div>
    </div>
    <div class="group-cover"></div>
    <div class="group-info">
        <div class="group-name" id="groupName"></div>
        <div class="group-desc" id="groupDesc"></div>
        <button class="join-btn" id="joinBtn">انضم للمجموعة</button>
    </div>

    <div class="post-form" id="postForm" style="display:none;">
        <textarea class="post-input" id="postContent" placeholder="اكتب منشوراً في المجموعة..."></textarea>
        <button class="post-btn" onclick="publishPost()">نشر</button>
    </div>

    <h3>المنشورات</h3>
    <div class="posts-list" id="postsList"></div>

    <h3>الأعضاء</h3>
    <div class="members-list" id="membersList"></div>
</div>

<div class="bottom-footer">
    <a href="home.html" class="footer-button"><i class="fas fa-home icon"></i><div class="label">الرئيسية</div></a>
    <a href="explore.html" class="footer-button"><i class="fas fa-compass icon"></i><div class="label">استكشاف</div></a>
    <a href="create-post.html" class="footer-button"><i class="fas fa-plus-circle icon"></i><div class="label">إنشاء</div></a>
    <a href="inbox.html" class="footer-button"><i class="fas fa-inbox icon"></i><div class="label">صندوق الوارد</div></a>
    <a href="profile.html" class="footer-button"><i class="fas fa-user icon"></i><div class="label">الملف الشخصي</div></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('id');
    let currentUser = null;
    let isMember = false;

    (async () => {
        await initDB();
        currentUser = await checkSession();
        if (!currentUser) { window.location.href='auth.html'; return; }
        await loadGroup();
    })();

    async function loadGroup() {
        const group = await fetchGroupDetails(groupId);
        if (!group) { alert('المجموعة غير موجودة'); return; }
        document.getElementById('groupName').textContent = group.name;
        document.getElementById('groupNameHeader').textContent = group.name;
        document.getElementById('groupDesc').textContent = group.description || '';
        document.getElementById('membersList').innerHTML = group.members.map(m => 
            `<img src="${m.users?.avatar || 'https://via.placeholder.com/32'}" class="member-avatar" title="${m.users?.username}">`
        ).join('');
        document.getElementById('postsList').innerHTML = group.posts.map(p => 
            `<div class="post-item"><div class="post-author">${p.author?.username || 'مستخدم'}</div><div class="post-content">${escapeHtml(p.content)}</div></div>`
        ).join('');

        isMember = group.members.some(m => m.user_id === currentUser.id);
        const joinBtn = document.getElementById('joinBtn');
        if (isMember) {
            joinBtn.textContent = 'أنت عضو';
            joinBtn.style.background = 'var(--surface2)';
            joinBtn.style.color = 'var(--text)';
            joinBtn.onclick = () => leaveGroup(groupId).then(() => location.reload());
            document.getElementById('postForm').style.display = 'block';
        } else {
            joinBtn.textContent = 'انضم للمجموعة';
            joinBtn.onclick = () => joinGroup(groupId).then(() => location.reload());
        }
    }

    async function publishPost() {
        const content = document.getElementById('postContent').value.trim();
        if (!content) return;
        await createGroupPost(groupId, content);
        document.getElementById('postContent').value = '';
        loadGroup();
    }

    function escapeHtml(s) { return s?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }
</script>
</body>
</html>
