<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>المجموعات | Ramz-X</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --surface: #fff; --surface2: #f1f5f9;
            --text: #0f172a; --text2: #475569; --text3: #94a3b8;
            --border: #cbd5e1; --accent: #3b82f6; --radius: 16px;
        }
        body.dark {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
            --text: #e2e8f0; --text2: #cbd5e1; --text3: #94a3b8; --border: #475569;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--bg); font-family:'Cairo',sans-serif; min-height:100vh;
            padding-bottom:80px; color:var(--text);
        }
        .container { max-width:600px; margin:0 auto; padding:16px; }
        .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
        .back-btn { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text); }
        h1 { font-size:1.5rem; }
        .create-btn { background:var(--accent); color:#fff; padding:10px 20px; border-radius:30px; border:none; font-weight:600; cursor:pointer; }
        .groups-grid { display:grid; gap:16px; }
        .group-card {
            background:var(--surface); border-radius:var(--radius); padding:16px;
            border:1px solid var(--border); transition:0.2s; cursor:pointer;
        }
        .group-card:hover { border-color:var(--accent); }
        .group-name { font-weight:700; margin-bottom:8px; }
        .group-desc { color:var(--text2); font-size:14px; margin-bottom:12px; }
        .group-meta { display:flex; gap:12px; font-size:12px; color:var(--text3); }
        .bottom-footer {
            position:fixed; bottom:0; left:0; right:0; background:var(--surface);
            display:flex; justify-content:space-around; padding:8px 0;
            border-top:1px solid var(--border); z-index:30;
        }
        .footer-button { background:none; border:none; text-align:center; cursor:pointer; color:var(--text2); text-decoration:none; }
        .icon { font-size:22px; display:block; margin-bottom:4px; }
        .label { font-size:11px; }
    </style>
</head>
<body class="dark">

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
        <h1>المجموعات</h1>
        <button class="create-btn" onclick="createNewGroup()"><i class="fas fa-plus"></i> إنشاء</button>
    </div>
    <div class="groups-grid" id="groupsList">
        <p style="text-align:center;color:var(--text3);">جاري تحميل المجموعات...</p>
    </div>
</div>

<div class="bottom-footer">
    <a href="home.html" class="footer-button"><i class="fas fa-home icon"></i><div class="label">الرئيسية</div></a>
    <a href="explore.html" class="footer-button"><i class="fas fa-compass icon"></i><div class="label">استكشاف</div></a>
    <a href="create-post.html" class="footer-button"><i class="fas fa-plus-circle icon"></i><div class="label">إنشاء</div></a>
    <a href="inbox.html" class="footer-button"><i class="fas fa-inbox icon"></i><div class="label">صندوق الوارد</div></a>
    <a href="profile.html" class="footer-button"><i class="fas fa-user icon"></i><div class="label">الملف الشخصي</div></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
    (async () => {
        await initDB();
        const currentUser = await checkSession();
        if (!currentUser) { window.location.href='auth.html'; return; }
        loadGroups();
    })();

    async function loadGroups() {
        const groups = await fetchPublicGroups();
        const container = document.getElementById('groupsList');
        if (!groups.length) {
            container.innerHTML = '<p style="text-align:center;color:var(--text3);">لا توجد مجموعات عامة بعد. كن أول من ينشئ واحدة!</p>';
            return;
        }
        container.innerHTML = groups.map(g => `
            <div class="group-card" onclick="window.location.href='group.html?id=${g.id}'">
                <div class="group-name">${escapeHtml(g.name)}</div>
                <div class="group-desc">${escapeHtml(g.description || '')}</div>
                <div class="group-meta">
                    <span><i class="fas fa-users"></i> ${g.members?.[0]?.count || 0} أعضاء</span>
                    <span><i class="fas fa-clock"></i> ${new Date(g.created_at).toLocaleDateString('ar')}</span>
                </div>
            </div>
        `).join('');
    }

    function createNewGroup() {
        const name = prompt('اسم المجموعة:');
        if (!name) return;
        const desc = prompt('وصف المجموعة (اختياري):');
        const isPublic = confirm('هل تريدها مجموعة عامة؟');
        createGroup(name, desc, isPublic);
    }

    async function createGroup(name, desc, isPublic) {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const { data, error } = await supabase.from('groups').insert({
            name: name,
            description: desc || '',
            created_by: user.id,
            is_public: isPublic,
            created_at: new Date().toISOString()
        }).select().single();
        if (error) { alert('فشل إنشاء المجموعة'); return; }
        await supabase.from('group_members').insert({ group_id: data.id, user_id: user.id, role: 'admin' });
        window.location.href = `group.html?id=${data.id}`;
    }
</script>
</body>
</html>
